<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Учёт сотрудников</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
    <header class="page-header">
        <div>
            <h1>Учёт сотрудников</h1>
            <p class="muted">Список сотрудников организации</p>
        </div>
        <a class="button" th:href="@{/employees/add}">Добавить сотрудника</a>
    </header>

    <div class="notice" th:if="${notice}" th:text="${notice}"></div>

    <form class="filters" method="get" th:action="@{/employees}">
        <label>
            Поиск по ФИО
            <input type="search" name="name" placeholder="Например, Иванов Иван" th:value="${name}">
        </label>
        <label>
            Активность
            <select name="active">
                <option value="" th:selected="${active == ''}">Все сотрудники</option>
                <option value="true" th:selected="${active == 'true'}">Активные</option>
                <option value="false" th:selected="${active == 'false'}">Неактивные</option>
            </select>
        </label>
        <div class="filter-buttons">
            <button class="button" type="submit">Найти</button>
            <a class="button button-secondary" th:href="@{/employees}">Сбросить</a>
        </div>
    </form>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>ФИО</th>
                <th>Email</th>
                <th>Телефон</th>
                <th>Должность</th>
                <th>Зарплата</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="employee : ${employees}">
                <td th:text="${employee.id}"></td>
                <td th:text="${employee.fullName}"></td>
                <td><a th:href="'mailto:' + ${employee.email}" th:text="${employee.email}"></a></td>
                <td th:text="${employee.phone}"></td>
                <td th:text="${employee.position}"></td>
                <td th:text="${#numbers.formatDecimal(employee.salary, 1, 2)} + ' ₽'"></td>
                <td>
                    <span class="status" th:classappend="${employee.active} ? ' status-active' : ' status-inactive'"
                          th:text="${employee.active} ? 'Активен' : 'Неактивен'"></span>
                </td>
                <td class="actions">
                    <a class="button button-small button-secondary"
                       th:href="@{/employees/edit/{id}(id=${employee.id})}">Изменить</a>
                    <form method="post" th:action="@{/employees/delete/{id}(id=${employee.id})}"
                          onsubmit="return confirm('Удалить сотрудника?')">
                        <button class="button button-small button-danger" type="submit">Удалить</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(employees)}">
                <td class="empty" colspan="8">Сотрудники не найдены</td>
            </tr>
            </tbody>
        </table>
    </div>
    <p class="result-count" th:text="'Найдено сотрудников: ' + ${#lists.size(employees)}"></p>
</main>
</body>
</html>
